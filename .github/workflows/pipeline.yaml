name: CI Pipeline
on:
  push:
    branches: [main]

job:
  build:
    runs-on: ubuntu-latest
  steps:
    -name: Checkout Code
    uses: actions/checkout@v5

    -name: settup Node.js
    uses: actions/setup-node@v3
    with:
      node-version: 16

    -name: Install dependencies
    run: npm Install

    -name: Run Tests
    run: npm test  
      
